{% extends "base.html" %}
{% block content %}
<h2>Добавить компонент</h2>

<form method="post">
    <div class="mb-3">
        <label class="form-label">Самолёт</label>
        <select name="aircraft_id" class="form-select" required>
            <option value="">Выберите самолёт</option>
            {% for a in aircrafts %}
            <option value="{{ a.aircraft_id }}">{{ a.registration_number }} ({{ a.airline }})</option>
            {% endfor %}
        </select>
    </div>
    <div class="mb-3">
        <label class="form-label">Тип компонента</label>
        <select name="type_id" class="form-select" required>
            <option value="">Выберите тип</option>
            {% for t in types %}
            <option value="{{ t.type_id }}">{{ t.type_name }} ({{ t.manufacturer }})</option>
            {% endfor %}
        </select>
    </div>
    <div class="mb-3">
        <label class="form-label">Серийный номер</label>
        <input type="text" name="serial_number" class="form-control" required maxlength="50">
    </div>
    <div class="mb-3">
        <label class="form-label">Дата установки</label>
        <input type="date" name="installation_date" class="form-control">
    </div>
    <div class="mb-3">
        <label class="form-label">Текущие часы</label>
        <input type="number" step="0.1" name="current_hours" class="form-control" value="0.0">
    </div>
    <div class="mb-3">
        <label class="form-label">Текущие циклы</label>
        <input type="number" name="current_cycles" class="form-control" value="0">
    </div>
    <button type="submit" class="btn btn-primary">Сохранить</button>
    <a href="{{ url_for('maintenance.list_maintenance') }}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
