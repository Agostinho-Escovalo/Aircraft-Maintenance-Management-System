{% extends "base.html" %}
{% block content %}
<h2>Добавить самолёт</h2>

<form method="post">
    <div class="mb-3">
        <label class="form-label">ID самолёта (PK)</label>
        <input type="text" name="aircraft_id" class="form-control" required maxlength="15">
    </div>
    <div class="mb-3">
        <label class="form-label">Регистрационный номер</label>
        <input type="text" name="registration_number" class="form-control" required maxlength="15">
    </div>
    <div class="mb-3">
        <label class="form-label">Модель</label>
        <select name="model_id" class="form-select" required>
            <option value="">Выберите модель</option>
            {% for m in models %}
            <option value="{{ m.model_id }}">{{ m.manufacturer }} {{ m.model_name }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="mb-3">
        <label class="form-label">Авиакомпания</label>
        <input type="text" name="airline" class="form-control" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Дата производства</label>
        <input type="date" name="production_date" class="form-control">
    </div>
    <div class="mb-3">
        <label class="form-label">Налёт часов</label>
        <input type="number" step="0.1" name="total_flight_hours" class="form-control" value="0.0">
    </div>
    <div class="mb-3">
        <label class="form-label">Количество циклов</label>
        <input type="number" name="total_cycles" class="form-control" value="0">
    </div>
    <button type="submit" class="btn btn-primary">Сохранить</button>
    <a href="{{ url_for('aircraft.list_aircraft') }}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
